name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bats:
    # macOS runner: the suite exercises BSD `tail -r` and mocks brew/stow rather
    # than installing anything, so nothing here touches the host beyond bats.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: install bats
        run: brew install bats-core

      - name: run test suite
        run: make test
