name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bats:
    # macOS runner: the suite needs BSD `tail -r`. brew and stow are mocked.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: install bats
        run: brew install bats-core

      - name: run test suite
        run: make test
